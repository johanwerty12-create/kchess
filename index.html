<!DOCTYPE html>
<html>
<head>
    <title>KChess</title>

    <!-- Chess rules -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        body {
            background: #111827;
            color: white;
            font-family: Arial;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 42px;
            margin: 10px;
        }

        #status {
            font-size: 20px;
            margin: 15px;
        }

        #board {
            width: 480px;
            height: 480px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            cursor: pointer;
            user-select: none;
        }

        .light {
            background: #f0d9b5;
        }

        .dark {
            background: #b58863;
        }

        .selected {
            background: #f6e05e !important;
        }

        .possible {
            box-shadow: inset 0 0 0 5px rgba(0, 200, 0, 0.5);
        }

        .white-piece {
            color: white;
            text-shadow: 2px 2px 3px #555;
        }

        .black-piece {
            color: black;
            text-shadow: 1px 1px 2px #777;
        }

        button {
            font-size: 18px;
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        @media (max-width: 550px) {
            #board {
                width: 90vw;
                height: 90vw;
            }

            .square {
                width: calc(90vw / 8);
                height: calc(90vw / 8);
                font-size: 8vw;
            }
        }
    </style>
</head>

<body>

<h1>♟️ KChess</h1>

<div id="status">Your turn! You are White.</div>

<div id="board"></div>

<button onclick="newGame()">🔄 New Game</button>

<script>

const game = new Chess();

const board = document.getElementById("board");
const status = document.getElementById("status");

let selectedSquare = null;
let possibleMoves = [];


const pieces = {
    w: {
        p: "♙",
        r: "♖",
        n: "♘",
        b: "♗",
        q: "♕",
        k: "♔"
    },

    b: {
        p: "♟",
        r: "♜",
        n: "♞",
        b: "♝",
        q: "♛",
        k: "♚"
    }
};


function drawBoard() {

    board.innerHTML = "";

    const position = game.board();

    for (let row = 0; row < 8; row++) {

        for (let col = 0; col < 8; col++) {

            const square = document.createElement("div");

            const squareName =
                String.fromCharCode(97 + col) +
                (8 - row);

            square.classList.add("square");

            if ((row + col) % 2 === 0) {
                square.classList.add("light");
            } else {
                square.classList.add("dark");
            }

            if (selectedSquare === squareName) {
                square.classList.add("selected");
            }

            if (possibleMoves.includes(squareName)) {
                square.classList.add("possible");
            }

            const piece = position[row][col];

            if (piece) {

                square.textContent =
                    pieces[piece.color][piece.type];

                if (piece.color === "w") {
                    square.classList.add("white-piece");
                } else {
                    square.classList.add("black-piece");
                }

                // Dragging
                square.draggable = piece.color === "w";

                square.addEventListener("dragstart", function(event) {

                    if (game.turn() !== "w") {
                        event.preventDefault();
                        return;
                    }

                    selectSquare(squareName);

                    event.dataTransfer.setData(
                        "text/plain",
                        squareName
                    );
                });
            }

            // Allow dropping
            square.addEventListener("dragover", function(event) {
                event.preventDefault();
            });

            square.addEventListener("drop", function(event) {

                event.preventDefault();

                const from =
                    event.dataTransfer.getData("text/plain");

                movePiece(from, squareName);
            });

            // Click movement
            square.addEventListener("click", function() {
                handleClick(squareName);
            });

            board.appendChild(square);
        }
    }
}


function selectSquare(square) {

    const moves = game.moves({
        square: square,
        verbose: true
    });

    if (moves.length === 0) {
        return;
    }

    selectedSquare = square;

    possibleMoves = moves.map(move => move.to);

    drawBoard();
}


function handleClick(square) {

    // First click
    if (selectedSquare === null) {

        const piece = game.get(square);

        if (piece && piece.color === "w") {
            selectSquare(square);
        }

        return;
    }

    // Click the same square
    if (square === selectedSquare) {

        selectedSquare = null;
        possibleMoves = [];

        drawBoard();

        return;
    }

    // Click another white piece
    const piece = game.get(square);

    if (piece && piece.color === "w") {

        selectSquare(square);

        return;
    }

    // Try to move
    movePiece(selectedSquare, square);
}


function movePiece(from, to) {

    if (game.turn() !== "w") {
        return;
    }

    if (!possibleMoves.includes(to)) {
        return;
    }

    const move = game.move({
        from: from,
        to: to,

        // Automatically promote pawns to queens
        promotion: "q"
    });

    if (!move) {
        return;
    }

    selectedSquare = null;
    possibleMoves = [];

    drawBoard();

    updateStatus();

    if (!game.game_over()) {

        status.textContent = "🤖 AI is thinking...";

        setTimeout(aiMove, 700);
    }
}


function aiMove() {

    if (game.game_over()) {
        updateStatus();
        return;
    }

    const moves = game.moves();

    if (moves.length === 0) {
        updateStatus();
        return;
    }

    // Simple AI:
    // chooses a legal move randomly
    const randomMove =
        moves[Math.floor(Math.random() * moves.length)];

    game.move(randomMove);

    drawBoard();

    updateStatus();
}


function updateStatus() {

    if (game.in_checkmate()) {

        if (game.turn() === "w") {
            status.textContent = "🤖 Checkmate! AI wins!";
        } else {
            status.textContent = "🎉 Checkmate! You win!";
        }

        return;
    }

    if (game.in_stalemate()) {
        status.textContent = "🤝 Stalemate!";
        return;
    }

    if (game.in_draw()) {
        status.textContent = "🤝 Draw!";
        return;
    }

    if (game.in_check()) {

        if (game.turn() === "w") {
            status.textContent = "⚠️ CHECK! Your turn!";
        } else {
            status.textContent = "⚠️ CHECK! AI's turn!";
        }

        return;
    }

    if (game.turn() === "w") {
        status.textContent = "Your turn!";
    } else {
        status.textContent = "🤖 AI's turn!";
    }
}


function newGame() {

    game.reset();

    selectedSquare = null;
    possibleMoves = [];

    status.textContent =
        "Your turn! You are White.";

    drawBoard();
}


drawBoard();

</script>

</body>
</html>
