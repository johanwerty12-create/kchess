<!DOCTYPE html>
<html>
<head>
    <title>KChess</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        body {
            background: #111827;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            font-size: 42px;
        }

        #status {
            font-size: 20px;
            margin: 15px;
        }

        #board {
            width: 480px;
            height: 480px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 44px;
        }

        .light {
            background: #f0d9b5;
        }

        .dark {
            background: #b58863;
        }

        .selected {
            background: yellow !important;
        }

        .possible {
            box-shadow: inset 0 0 0 5px lime;
        }

        .piece {
            cursor: grab;
            user-select: none;
        }

        .piece:active {
            cursor: grabbing;
        }

        .white {
            color: white;
            text-shadow: 2px 2px 3px #555;
        }

        .black {
            color: black;
        }

        button {
            font-size: 18px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>♟️ KChess</h1>

<div id="status">Your turn! You are White.</div>

<div id="board"></div>

<button onclick="newGame()">🔄 New Game</button>

<script>

const game = new Chess();

const board = document.getElementById("board");
const status = document.getElementById("status");

let selected = null;

const pieces = {
    wp: "♙",
    wr: "♖",
    wn: "♘",
    wb: "♗",
    wq: "♕",
    wk: "♔",

    bp: "♟",
    br: "♜",
    bn: "♞",
    bb: "♝",
    bq: "♛",
    bk: "♚"
};


function drawBoard() {

    board.innerHTML = "";

    const position = game.board();

    for (let row = 0; row < 8; row++) {

        for (let col = 0; col < 8; col++) {

            const square = document.createElement("div");

            const name =
                String.fromCharCode(97 + col) + (8 - row);

            square.classList.add("square");

            if ((row + col) % 2 === 0) {
                square.classList.add("light");
            } else {
                square.classList.add("dark");
            }

            if (selected === name) {
                square.classList.add("selected");
            }

            const piece = position[row][col];

            if (piece) {

                const pieceElement = document.createElement("div");

                pieceElement.textContent =
                    pieces[piece.color + piece.type];

                pieceElement.classList.add("piece");

                if (piece.color === "w") {
                    pieceElement.classList.add("white");
                } else {
                    pieceElement.classList.add("black");
                }

                /*
                    DRAG START
                */
                pieceElement.draggable = piece.color === "w";

                pieceElement.addEventListener("dragstart", function(event) {

                    if (game.turn() !== "w") {
                        event.preventDefault();
                        return;
                    }

                    selected = name;

                    event.dataTransfer.setData(
                        "text/plain",
                        name
                    );
                });

                /*
                    CLICK
                */
                pieceElement.addEventListener("click", function() {

                    if (piece.color === "w" &&
                        game.turn() === "w") {

                        selected = name;

                        drawBoard();
                    }
                });

                square.appendChild(pieceElement);
            }

            /*
                DROP
            */
            square.addEventListener("dragover", function(event) {

                event.preventDefault();

            });

            square.addEventListener("drop", function(event) {

                event.preventDefault();

                const from =
                    event.dataTransfer.getData("text/plain");

                movePiece(from, name);
            });

            /*
                CLICK DESTINATION
            */
            square.addEventListener("click", function() {

                if (selected !== null &&
                    selected !== name) {

                    movePiece(selected, name);
                }

            });

            board.appendChild(square);
        }
    }
}


function movePiece(from, to) {

    if (!from) return;

    const move = game.move({
        from: from,
        to: to,
        promotion: "q"
    });

    selected = null;

    if (move === null) {

        drawBoard();

        status.textContent = "❌ Illegal move!";

        setTimeout(function() {
            updateStatus();
        }, 800);

        return;
    }

    drawBoard();

    updateStatus();

    if (!game.game_over()) {

        setTimeout(aiMove, 700);
    }
}


function aiMove() {

    if (game.game_over()) {
        return;
    }

    const moves = game.moves();

    if (moves.length === 0) {
        return;
    }

    const randomMove =
        moves[Math.floor(Math.random() * moves.length)];

    game.move(randomMove);

    drawBoard();

    updateStatus();
}


function updateStatus() {

    if (game.in_checkmate()) {

        if (game.turn() === "w") {
            status.textContent = "🤖 Checkmate! AI wins!";
        } else {
            status.textContent = "🎉 Checkmate! You win!";
        }

        return;
    }

    if (game.in_stalemate()) {

        status.textContent = "🤝 Stalemate!";

        return;
    }

    if (game.in_draw()) {

        status.textContent = "🤝 Draw!";

        return;
    }

    if (game.in_check()) {

        status.textContent = "⚠️ CHECK!";

        return;
    }

    if (game.turn() === "w") {

        status.textContent = "Your turn!";

    } else {

        status.textContent = "🤖 AI is thinking...";
    }
}


function newGame() {

    game.reset();

    selected = null;

    status.textContent =
        "Your turn! You are White.";

    drawBoard();
}


drawBoard();

</script>

</body>
</html>
