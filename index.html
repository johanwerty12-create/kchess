<!DOCTYPE html>
<html>
<head>
    <title>KChess</title>

    <style>
        body {
            background: #111827;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            font-size: 40px;
        }

        #board {
            width: 480px;
            height: 480px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
        }

        .square {
            width: 60px;
            height: 60px;
            font-size: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .light {
            background: #f0d9b5;
        }

        .dark {
            background: #b58863;
        }

        .selected {
            background: #f6e05e !important;
        }

        .white-piece {
            color: white;
            text-shadow: 2px 2px 2px #555;
        }

        .black-piece {
            color: black;
            text-shadow: 1px 1px 1px #777;
        }

        button {
            font-size: 18px;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
        }

        #status {
            font-size: 20px;
            margin: 15px;
        }
    </style>
</head>

<body>

<h1>♟️ KChess</h1>

<div id="status">Your turn! You are White.</div>

<div id="board"></div>

<button onclick="newGame()">🔄 New Game</button>

<script>

const startingBoard = [
    "♜","♞","♝","♛","♚","♝","♞","♜",
    "♟","♟","♟","♟","♟","♟","♟","♟",
    "","","","","","","","",
    "","","","","","","","",
    "","","","","","","","",
    "","","","","","","","",
    "♙","♙","♙","♙","♙","♙","♙","♙",
    "♖","♘","♗","♕","♔","♗","♘","♖"
];

let boardPieces = [...startingBoard];
let selected = null;
let playerTurn = true;

const board = document.getElementById("board");
const status = document.getElementById("status");


function isWhite(piece) {
    return ["♙","♖","♘","♗","♕","♔"].includes(piece);
}


function isBlack(piece) {
    return ["♟","♜","♞","♝","♛","♚"].includes(piece);
}


function drawBoard() {

    board.innerHTML = "";

    for (let i = 0; i < 64; i++) {

        const square = document.createElement("div");

        square.classList.add("square");

        if ((Math.floor(i / 8) + i) % 2 === 0) {
            square.classList.add("light");
        } else {
            square.classList.add("dark");
        }

        if (selected === i) {
            square.classList.add("selected");
        }

        const piece = boardPieces[i];

        if (piece) {
            square.textContent = piece;

            if (isWhite(piece)) {
                square.classList.add("white-piece");
            } else {
                square.classList.add("black-piece");
            }
        }

        square.onclick = () => clickSquare(i);

        board.appendChild(square);
    }
}


function clickSquare(i) {

    if (!playerTurn) return;

    const piece = boardPieces[i];

    // Select a white piece
    if (selected === null) {

        if (isWhite(piece)) {
            selected = i;
            drawBoard();
        }

        return;
    }

    // Click another white piece
    if (isWhite(piece)) {
        selected = i;
        drawBoard();
        return;
    }

    // Move the selected piece
    if (selected !== i) {

        boardPieces[i] = boardPieces[selected];
        boardPieces[selected] = "";

        selected = null;

        playerTurn = false;

        drawBoard();

        status.textContent = "🤖 AI is thinking...";

        setTimeout(aiMove, 800);
    }
}


function aiMove() {

    let possibleMoves = [];

    for (let from = 0; from < 64; from++) {

        if (!isBlack(boardPieces[from])) continue;

        for (let to = 0; to < 64; to++) {

            if (
                boardPieces[to] === "" ||
                isWhite(boardPieces[to])
            ) {
                possibleMoves.push({
                    from: from,
                    to: to
                });
            }
        }
    }

    if (possibleMoves.length === 0) {
        status.textContent = "🎉 You win!";
        return;
    }

    // AI chooses a random move
    const move =
        possibleMoves[
            Math.floor(Math.random() * possibleMoves.length)
        ];

    boardPieces[move.to] = boardPieces[move.from];
    boardPieces[move.from] = "";

    drawBoard();

    playerTurn = true;

    status.textContent = "Your turn!";
}


function newGame() {

    boardPieces = [...startingBoard];

    selected = null;

    playerTurn = true;

    status.textContent = "Your turn! You are White.";

    drawBoard();
}


drawBoard();

</script>

</body>
</html>
