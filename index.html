<!DOCTYPE html> 
<html>
<head>
    <title>KChess</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        body {
            background: #111827;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        #controls {
            margin: 15px;
        }

        select, button {
            font-size: 17px;
            padding: 9px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        #status {
            font-size: 20px;
            margin: 15px;
        }

        #board {
            width: 480px;
            height: 480px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            user-select: none;
        }

        .light {
            background: #f0d9b5;
        }

        .dark {
            background: #b58863;
        }

        .piece {
            cursor: grab;
        }

        .piece:active {
            cursor: grabbing;
        }

        .white {
            color: white;
            text-shadow: 2px 2px 3px #555;
        }

        .black {
            color: black;
        }

        .selected {
            background: yellow !important;
        }

        .possible {
            box-shadow: inset 0 0 0 5px lime;
        }
    </style>
</head>

<body>

<h1>♟️ KChess</h1>

<div id="controls">

    <label>🤖 Bot:</label>

    <select id="difficulty" onchange="changeDifficulty()">
        <option value="1">Easy — 250 ELO</option>
        <option value="2">Medium — 500 ELO</option>
        <option value="3" selected>Hard — 1000 ELO</option>
        <option value="4">Very Hard — 1500 ELO</option>
        <option value="5">Expert — 2000 ELO</option>
    </select>

</div>

<div id="status">Your turn! You are White.</div>

<div id="board"></div>

<button onclick="newGame()">🔄 New Game</button>

<script>

const game = new Chess();

const board = document.getElementById("board");
const status = document.getElementById("status");
const difficulty = document.getElementById("difficulty");

let selected = null;

let botLevel = 3;


const pieces = {

    wp: "♙",
    wr: "♖",
    wn: "♘",
    wb: "♗",
    wq: "♕",
    wk: "♔",

    bp: "♟",
    br: "♜",
    bn: "♞",
    bb: "♝",
    bq: "♛",
    bk: "♚"
};


/* PIECE VALUES */

const values = {

    p: 100,
    n: 320,
    b: 330,
    r: 500,
    q: 900,
    k: 20000
};


/* DRAW BOARD */

function drawBoard() {

    board.innerHTML = "";

    const position = game.board();

    for (let row = 0; row < 8; row++) {

        for (let col = 0; col < 8; col++) {

            const square = document.createElement("div");

            const name =
                String.fromCharCode(97 + col) + (8 - row);

            square.classList.add("square");

            if ((row + col) % 2 === 0) {
                square.classList.add("light");
            } else {
                square.classList.add("dark");
            }

            if (selected === name) {
                square.classList.add("selected");
            }

            const piece = position[row][col];

            if (piece) {

                const element =
                    document.createElement("div");

                element.textContent =
                    pieces[piece.color + piece.type];

                element.classList.add("piece");

                element.classList.add(
                    piece.color === "w"
                    ? "white"
                    : "black"
                );

                /* DRAGGING */

                if (piece.color === "w") {

                    element.draggable = true;

                    element.addEventListener(
                        "dragstart",
                        function(event) {

                            if (game.turn() !== "w") {
                                event.preventDefault();
                                return;
                            }

                            selected = name;

                            event.dataTransfer.setData(
                                "text/plain",
                                name
                            );
                        }
                    );
                }

                /* CLICK */

                element.addEventListener(
                    "click",
                    function(event) {

                        event.stopPropagation();

                        if (
                            piece.color === "w" &&
                            game.turn() === "w"
                        ) {

                            selected = name;

                            drawBoard();
                        }
                    }
                );

                square.appendChild(element);
            }

            /* DROP */

            square.addEventListener(
                "dragover",
                function(event) {
                    event.preventDefault();
                }
            );

            square.addEventListener(
                "drop",
                function(event) {

                    event.preventDefault();

                    const from =
                        event.dataTransfer.getData(
                            "text/plain"
                        );

                    movePiece(from, name);
                }
            );

            /* CLICK DESTINATION */

            square.addEventListener(
                "click",
                function() {

                    if (
                        selected !== null &&
                        selected !== name
                    ) {

                        movePiece(selected, name);
                    }
                }
            );

            board.appendChild(square);
        }
    }
}


/* PLAYER MOVE */

function movePiece(from, to) {

    if (!from) return;

    const move = game.move({

        from: from,

        to: to,

        promotion: "q"
    });

    selected = null;

    if (move === null) {

        drawBoard();

        status.textContent =
            "❌ Illegal move!";

        setTimeout(updateStatus, 800);

        return;
    }

    drawBoard();

    updateStatus();

    if (!game.game_over()) {

        setTimeout(aiMove, 500);
    }
}


/* AI */

function aiMove() {

    if (game.game_over()) return;

    status.textContent =
        "🤖 Bot is thinking...";

    const moves = game.moves();

    if (moves.length === 0) return;

    let chosenMove;


    /*
        EASY
        Mostly random
    */

    if (botLevel === 1) {

        chosenMove =
            moves[
                Math.floor(
                    Math.random() * moves.length
                )
            ];
    }


    /*
        MEDIUM
        Prefers captures
    */

    else if (botLevel === 2) {

        chosenMove =
            findBestSimpleMove(moves);
    }


    /*
        HARD
        Minimax depth 2
    */

    else if (botLevel === 3) {

        chosenMove =
            findBestMove(2);
    }


    /*
        VERY HARD
        Minimax depth 3
    */

    else if (botLevel === 4) {

        chosenMove =
            findBestMove(3);
    }


    /*
        EXPERT
        Minimax depth 4
    */

    else {

        chosenMove =
            findBestMove(4);
    }


    game.move(chosenMove);

    drawBoard();

    updateStatus();
}


/* EASY AI HELPER */

function findBestSimpleMove(moves) {

    let bestMoves = [];

    let bestValue = -999999;

    for (const move of moves) {

        let value = 0;

        if (move.includes("x")) {
            value += 500;
        }

        if (move.includes("q")) {
            value += 100;
        }

        value += Math.random() * 300;

        if (value > bestValue) {

            bestValue = value;

            bestMoves = [move];

        } else if (value === bestValue) {

            bestMoves.push(move);
        }
    }

    return bestMoves[
        Math.floor(
            Math.random() * bestMoves.length
        )
    ];
}


/* MINIMAX */

function findBestMove(depth) {

    const moves = game.moves();

    let bestMove = moves[0];

    let bestScore = -Infinity;

    for (const move of moves) {

        game.move(move);

        const score =
            -minimax(
                depth - 1,
                -Infinity,
                Infinity
            );

        game.undo();

        if (score > bestScore) {

            bestScore = score;

            bestMove = move;
        }
    }

    return bestMove;
}


function minimax(depth, alpha, beta) {

    if (depth === 0 ||
        game.game_over()) {

        return evaluateBoard();
    }

    const moves = game.moves();

    let bestScore = -Infinity;

    for (const move of moves) {

        game.move(move);

        const score =
            -minimax(
                depth - 1,
                -beta,
                -alpha
            );

        game.undo();

        bestScore =
            Math.max(
                bestScore,
                score
            );

        alpha =
            Math.max(
                alpha,
                score
            );

        if (alpha >= beta) {
            break;
        }
    }

    return bestScore;
}


/* POSITION EVALUATION */

function evaluateBoard() {

    if (game.in_checkmate()) {

        return game.turn() === "b"
            ? -999999
            : 999999;
    }

    let score = 0;

    const position = game.board();

    for (let row = 0; row < 8; row++) {

        for (let col = 0; col < 8; col++) {

            const piece =
                position[row][col];

            if (!piece) continue;

            const value =
                values[piece.type];

            if (piece.color === "b") {
                score += value;
            } else {
                score -= value;
            }
        }
    }

    return score;
}


/* DIFFICULTY */

function changeDifficulty() {

    botLevel =
        Number(difficulty.value);

    newGame();
}


/* STATUS */

function updateStatus() {

    if (game.in_checkmate()) {

        if (game.turn() === "w") {

            status.textContent =
                "🤖 Checkmate! Bot wins!";

        } else {

            status.textContent =
                "🎉 Checkmate! You win!";
        }

        return;
    }

    if (
        game.in_stalemate() ||
        game.in_draw()
    ) {

        status.textContent =
            "🤝 Draw!";

        return;
    }

    if (game.in_check()) {

        status.textContent =
            "⚠️ CHECK!";

        return;
    }

    if (game.turn() === "w") {

        status.textContent =
            "Your turn!";

    } else {

        status.textContent =
            "🤖 Bot is thinking...";
    }
}


/* NEW GAME */

function newGame() {

    game.reset();

    selected = null;

    status.textContent =
        "Your turn! You are White.";

    drawBoard();
}


drawBoard();

</script>

</body>
</html>
