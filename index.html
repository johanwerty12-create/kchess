<!DOCTYPE html>
<html>
<head>
    <title>KChess</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        body {
            background: #111827;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            font-size: 42px;
        }

        #status {
            font-size: 20px;
            margin: 15px;
        }

        #board {
            width: 480px;
            height: 480px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            user-select: none;
            cursor: grab;
            touch-action: none;
        }

        .square:active {
            cursor: grabbing;
        }

        .light {
            background: #f0d9b5;
        }

        .dark {
            background: #b58863;
        }

        .selected {
            background: #f6e05e !important;
        }

        .possible {
            box-shadow: inset 0 0 0 5px rgba(0, 200, 0, 0.5);
        }

        .white {
            color: white;
            text-shadow: 2px 2px 3px #555;
        }

        .black {
            color: black;
        }

        button {
            font-size: 18px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>♟️ KChess</h1>

<div id="status">Your turn! You are White.</div>

<div id="board"></div>

<button onclick="newGame()">🔄 New Game</button>

<script>

const game = new Chess();

const board = document.getElementById("board");
const status = document.getElementById("status");

const symbols = {
    wp: "♙",
    wr: "♖",
    wn: "♘",
    wb: "♗",
    wq: "♕",
    wk: "♔",

    bp: "♟",
    br: "♜",
    bn: "♞",
    bb: "♝",
    bq: "♛",
    bk: "♚"
};

let selected = null;
let possibleMoves = [];


function drawBoard() {

    board.innerHTML = "";

    const position = game.board();

    for (let row = 0; row < 8; row++) {

        for (let col = 0; col < 8; col++) {

            const square = document.createElement("div");

            const name =
                String.fromCharCode(97 + col) +
                (8 - row);

            square.className = "square";

            if ((row + col) % 2 === 0) {
                square.classList.add("light");
            } else {
                square.classList.add("dark");
            }

            if (selected === name) {
                square.classList.add("selected");
            }

            if (possibleMoves.includes(name)) {
                square.classList.add("possible");
            }

            const piece = position[row][col];

            if (piece) {

                square.textContent =
                    symbols[piece.color + piece.type];

                square.classList.add(
                    piece.color === "w" ? "white" : "black"
                );
            }

            // CLICK
            square.addEventListener("click", function() {
                clickSquare(name);
            });

            // DRAG
            square.addEventListener("pointerdown", function(event) {

                if (game.turn() !== "w") return;

                const piece = game.get(name);

                if (!piece || piece.color !== "w") return;

                selected = name;

                possibleMoves = game.moves({
                    square: name
                }).map(move => {
                    return move.slice(-2);
                });

                drawBoard();

                event.preventDefault();
            });

            square.addEventListener("pointerup", function(event) {

                if (selected && possibleMoves.includes(name)) {

                    movePiece(selected, name);

                }

                event.preventDefault();
            });

            board.appendChild(square);
        }
    }
}


function clickSquare(name) {

    if (game.turn() !== "w") return;

    const piece = game.get(name);

    // Select piece
    if (selected === null) {

        if (piece && piece.color === "w") {

            selected = name;

            possibleMoves = game.moves({
                square: name
            }).map(move => move.slice(-2));

            drawBoard();
        }

        return;
    }

    // Move
    if (possibleMoves.includes(name)) {

        movePiece(selected, name);

        return;
    }

    // Select another piece
    if (piece && piece.color === "w") {

        selected = name;

        possibleMoves = game.moves({
            square: name
        }).map(move => move.slice(-2));

        drawBoard();

        return;
    }

    selected = null;
    possibleMoves = [];

    drawBoard();
}


function movePiece(from, to) {

    const move = game.move({
        from: from,
        to: to,
        promotion: "q"
    });

    if (!move) return;

    selected = null;
    possibleMoves = [];

    drawBoard();

    updateStatus();

    if (!game.game_over()) {

        setTimeout(aiMove, 700);
    }
}


function aiMove() {

    if (game.game_over()) return;

    const moves = game.moves();

    if (moves.length === 0) return;

    const move =
        moves[Math.floor(Math.random() * moves.length)];

    game.move(move);

    drawBoard();

    updateStatus();
}


function updateStatus() {

    if (game.in_checkmate()) {

        if (game.turn() === "w") {
            status.textContent = "🤖 Checkmate! AI wins!";
        } else {
            status.textContent = "🎉 Checkmate! You win!";
        }

        return;
    }

    if (game.in_stalemate() || game.in_draw()) {

        status.textContent = "🤝 Draw!";

        return;
    }

    if (game.in_check()) {

        status.textContent = "⚠️ CHECK!";

        return;
    }

    status.textContent =
        game.turn() === "w"
        ? "Your turn!"
        : "🤖 AI is thinking...";
}


function newGame() {

    game.reset();

    selected = null;
    possibleMoves = [];

    status.textContent =
        "Your turn! You are White.";

    drawBoard();
}


drawBoard();

</script>

</body>
</html>
