<!DOCTYPE html>
<html>
<head>
    <title>KChess</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/chessboard.js/1.0.0/chessboard-1.0.0.min.css">

    <style>
        body {
            background: #111827;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            font-size: 42px;
        }

        #board {
            width: 480px;
            margin: 20px auto;
        }

        #status {
            font-size: 20px;
            margin: 15px;
        }

        button {
            font-size: 18px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>♟️ KChess</h1>

<div id="status">Your turn! You are White.</div>

<div id="board"></div>

<button onclick="newGame()">🔄 New Game</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard.js/1.0.0/chessboard-1.0.0.min.js"></script>

<script>

const game = new Chess();

let board;

function onDragStart(source, piece) {

    // Only allow White pieces
    if (game.game_over()) {
        return false;
    }

    if (game.turn() !== "w") {
        return false;
    }

    if (piece.search(/^b/) !== -1) {
        return false;
    }
}


function onDrop(source, target) {

    const move = game.move({
        from: source,
        to: target,
        promotion: "q"
    });

    // Illegal move
    if (move === null) {
        return "snapback";
    }

    updateStatus();

    // Let AI move
    setTimeout(aiMove, 700);
}


function onSnapEnd() {

    board.position(game.fen());
}


function aiMove() {

    if (game.game_over()) {
        updateStatus();
        return;
    }

    const moves = game.moves();

    if (moves.length === 0) {
        return;
    }

    // Simple AI chooses a legal move
    const move =
        moves[Math.floor(Math.random() * moves.length)];

    game.move(move);

    board.position(game.fen());

    updateStatus();
}


function updateStatus() {

    if (game.in_checkmate()) {

        if (game.turn() === "w") {
            document.getElementById("status").textContent =
                "🤖 Checkmate! AI wins!";
        } else {
            document.getElementById("status").textContent =
                "🎉 Checkmate! You win!";
        }

        return;
    }

    if (game.in_stalemate()) {
        document.getElementById("status").textContent =
            "🤝 Stalemate!";
        return;
    }

    if (game.in_draw()) {
        document.getElementById("status").textContent =
            "🤝 Draw!";
        return;
    }

    if (game.in_check()) {
        document.getElementById("status").textContent =
            "⚠️ CHECK!";
        return;
    }

    if (game.turn() === "w") {
        document.getElementById("status").textContent =
            "Your turn!";
    } else {
        document.getElementById("status").textContent =
            "🤖 AI is thinking...";
    }
}


function newGame() {

    game.reset();

    board.start();

    document.getElementById("status").textContent =
        "Your turn! You are White.";
}


const config = {

    draggable: true,

    position: "start",

    orientation: "white",

    onDragStart: onDragStart,

    onDrop: onDrop,

    onSnapEnd: onSnapEnd

};


board = Chessboard("board", config);

</script>

</body>
</html>
